---
# CI baseline for saf-agentic-harness.
#
# The gate is `make verify` — the SAME entry point the inner dev loop uses, so a green
# CI and a green desk mean the same thing. CI also renders the harness plugin, bootstraps it
# from its hash-locked lock on every supported OS, validates its manifest against the
# official Agent Plugins schema, and installs it with the Copilot CLI.

name: ci

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

permissions:
    contents: read

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    verify:
        name: Verify (Python ${{ matrix.python-version }}${{ matrix.os == 'windows-latest' && ', Windows' || '' }})
        runs-on: ${{ matrix.os }}
        # Windows runs the plugin suite through real PowerShell processes: allow for it.
        timeout-minutes: 35
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest]
                python-version: ["3.10", "3.11", "3.12"]
                # The harness runs on Windows in the GitHub Copilot app: keep the suite green there.
                include:
                    - os: windows-latest
                      python-version: "3.12"
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: ${{ matrix.python-version }}

            - name: Install dependencies
              run: pip install --quiet -r requirements-dev.txt

            - name: Run the verification gate
              if: runner.os != 'Windows'
              run: make verify

            # The same suite `make verify` runs; Windows runners have no portable `make` + POSIX
            # shell, and no `python3` alias.
            - name: Run the verification gate (Windows)
              if: runner.os == 'Windows'
              env:
                  PYTHONDONTWRITEBYTECODE: "1"
              run: python -m pytest -p no:cacheprovider tests -q

    plugin-bootstrap:
        # The harness plugin bootstraps from its hash-locked lock on every supported OS and on
        # the oldest and newest supported Python (adapter spec, Plugin mode). Python 3.10
        # provisions with pip, 3.13 with uv.
        name: Plugin bootstrap (${{ matrix.os }}, Python ${{ matrix.python-version }})
        runs-on: ${{ matrix.os }}
        timeout-minutes: 25
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, macos-latest, windows-latest]
                python-version: ["3.10", "3.13"]
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: ${{ matrix.python-version }}

            - name: Install dependencies
              run: python -m pip install --quiet -r requirements-dev.txt uv

            - name: Render the plugin with its lock
              run: python adapters/github-copilot/render_plugin.py --dest build/plugin

            - name: Provision with pip (uv off PATH)
              if: matrix.python-version == '3.10'
              run: python -m pip uninstall --quiet --yes uv

            - name: Bootstrap from the lock and run a governed session
              env:
                  SAF_PLUGIN_BOOTSTRAP_ROOT: build/plugin
                  PYTHONDONTWRITEBYTECODE: "1"
                  # Windows: the shim tries `py -3` first; make it the matrix interpreter.
                  PY_PYTHON3: ${{ matrix.python-version }}
              run: python -m pytest -p no:cacheprovider tests/functional/plugin -q

    plugin-manifest:
        name: Plugin manifest and install
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.12"

            - name: Install dependencies
              run: python -m pip install --quiet -r requirements.txt uv

            - name: Render the plugin with its lock
              run: python adapters/github-copilot/render_plugin.py --dest build/plugin

            - name: Validate the manifest against the official Agent Plugins schema
              run: |
                  curl -sSfL -o "$RUNNER_TEMP/plugin.schema.json" \
                      https://raw.githubusercontent.com/agentplugins/agent-plugins-spec/main/schemas/1.0.0/plugin.schema.json
                  python .github/scripts/validate_plugin_manifest.py build/plugin/plugin.json \
                      "$RUNNER_TEMP/plugin.schema.json"

            - name: Set up Node
              uses: actions/setup-node@v4
              with:
                  node-version: "22"

            - name: Install the plugin with the Copilot CLI (unauthenticated)
              run: |
                  npm install --global --silent @github/copilot
                  export COPILOT_HOME="$RUNNER_TEMP/copilot-home"
                  copilot --version
                  copilot plugin install "$PWD/build/plugin"
                  copilot plugin list | tee "$RUNNER_TEMP/plugins.txt"
                  grep -F "poesis-saf-agentic-harness" "$RUNNER_TEMP/plugins.txt"

    lint-markdown:
        name: Lint Markdown
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Run markdownlint-cli2
              uses: DavidAnson/markdownlint-cli2-action@v19
              with:
                  globs: "**/*.md"
                  config: ".markdownlint.yaml"

    lint-yaml:
        name: Lint YAML
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Install yamllint
              run: pip install yamllint --quiet

            - name: Run yamllint
              run: yamllint -d relaxed .
