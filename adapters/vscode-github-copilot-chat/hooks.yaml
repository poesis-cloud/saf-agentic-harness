# VS Code GitHub Copilot Chat hook registration (env-specific) — the source of truth in YAML.
# NOT installable as-is: `adapters/render_hooks.py` renders it to ONE workspace file,
# .github/hooks/safe-harness.json (the host collects every .github/hooks/*.json), substituting
# {{ADAPTERS_DIR}} with this harness checkout's adapters/ directory and {{FRAMEWORK_DIR}} with
# the absolute framework root. Both must be absolute in the installed file: the host resolves a
# hook command's cwd against $HOME by default, so every entry MUST pin cwd, and adapters/ ships
# in the HARNESS repo, so a command relative to the framework root names nothing. The rendered
# file is machine-specific — generated by `make install-hooks`, never committed.
# Event names are the host's PascalCase Agent-hooks vocabulary (8 events; no
# native SessionEnd). The host has NO per-tool matcher: PreToolUse/PostToolUse fire for every
# tool call and the harness classifies by tool_name via tools.yaml. The canonical control
# surface is structured stdout JSON on exit 0 (permissionDecision / decision:block /
# additionalContext / updatedInput); exit 2 is only the hard-failure fallback.
#
# NOT here: the session-started boundary (H0) is an AGENT-SCOPED UserPromptSubmit hook,
# rendered into each framework orchestrator's .agent.md frontmatter with its own slug as the
# trailing dispatch argument (top-level payloads never name the active agent — see def/spec.md
# H0 + I1/I2). Full per-hook specs: def/spec.md.
hooks:
  SubagentStart:
    [
      {
        type: command,
        command: "{{ADAPTERS_DIR}}/dispatch.sh SubagentStart vscode-github-copilot-chat",
        cwd: "{{FRAMEWORK_DIR}}",
        timeout: 60,
      },
    ]
  PreToolUse:
    [
      {
        type: command,
        command: "{{ADAPTERS_DIR}}/dispatch.sh PreToolUse vscode-github-copilot-chat",
        cwd: "{{FRAMEWORK_DIR}}",
        timeout: 60,
      },
    ]
  PostToolUse:
    [
      {
        type: command,
        command: "{{ADAPTERS_DIR}}/dispatch.sh PostToolUse vscode-github-copilot-chat",
        cwd: "{{FRAMEWORK_DIR}}",
        timeout: 60,
      },
    ]
  SubagentStop:
    [
      {
        type: command,
        command: "{{ADAPTERS_DIR}}/dispatch.sh SubagentStop vscode-github-copilot-chat",
        cwd: "{{FRAMEWORK_DIR}}",
        timeout: 10,
      },
    ]
  Stop:
    [
      {
        type: command,
        command: "{{ADAPTERS_DIR}}/dispatch.sh Stop vscode-github-copilot-chat",
        cwd: "{{FRAMEWORK_DIR}}",
        timeout: 10,
      },
    ]
