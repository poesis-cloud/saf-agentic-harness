# GitHub Copilot CLI / VS Code environment binding (env-specific tool/payload map).
# The harness core stays env-agnostic and reads this map; another host (Claude Code, Cursor, …)
# ships its own adapters/<env>/tools.yaml. `writeTools`/`deleteTools` map a host tool name to its action;
# the `*Keys` lists name the payload fields to probe (first hit wins).
writeTools:
  create_file: create
  create_directory: create
  replace_string_in_file: update
  multi_replace_string_in_file: update
  edit_notebook_file: update
  insert_edit_into_file: update
  apply_patch: update
deleteTools: [delete_file]
toolKeys: [tool, tool_name, toolName]
inputKeys: [tool_input, toolInput, arguments]
pathKeys: [filePath, path, file]
actorKeys: [agent, agentName, actor, subagent]
hostSessionKeys: [sessionId, session_id, session]
hostParentSessionKeys: [parentSessionId, parent_session_id, parentSession]
# Subagent dispatch (runSubagent): the tool that starts a child step-session. The harness governs the
# (target agent, model) selection at preToolUse — see ModelRouter.validate_dispatch.
dispatchTools: [runSubagent]
dispatchAgentKeys: [agentName, agent, subagent, name]
dispatchModelKeys: [model]
