# GitHub Copilot CLI / GitHub Copilot app hook registration (env-specific) — the source of truth
# in YAML. NOT installable as-is: `install.py` renders it into ONE `{"version": 1, "hooks": ...}`
# file (a plugin bundle's hooks.json, a repository's .github/hooks/<name>.json, or the user-level
# ~/.copilot/hooks/<name>.json), each entry running
#
#   <python> <adapters>/github-copilot/adapter.py hook --event <event> --framework-dir <fw>
#
# with an explicit interpreter (`exec` + `args`: no shell, so no bash on Windows), `cwd` pinned to
# the framework root and every FRAMEWORK_* variable in `env`. The rendered file carries absolute
# machine paths — generated, never committed.
#
# No `matcher`: the app batches several tool calls into one preToolUse firing, and the
# adapter classifies every call itself from tools.yaml. `timeoutSec` matters: a TIMED-OUT
# preToolUse hook FAILS OPEN in this runtime, so the gating events get a generous budget.
#
# sessionStart only injects the harness command line (stateless). NOT here: the session-opening
# boundary (H0) is agent-scoped — see agent-hooks.yaml.
hooks:
  sessionStart: { timeoutSec: 30 }
  subagentStart: { timeoutSec: 120 }
  preToolUse: { timeoutSec: 120 }
  postToolUse: { timeoutSec: 120 }
  postToolUseFailure: { timeoutSec: 60 }
  subagentStop: { timeoutSec: 60 }
  agentStop: { timeoutSec: 60 }
  sessionEnd: { timeoutSec: 60 }
  errorOccurred: { timeoutSec: 15 }
