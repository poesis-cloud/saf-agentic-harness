# GitHub Copilot CLI / VS Code environment binding — canonical model id -> host model id map.
# The harness core and conf/model-profiles.conf.yaml stay host-agnostic; this file is the ONLY
# place that names the exact string this host expects as the `runSubagent` `model` argument.
# Another host (Claude Code, Cursor, …) ships its own adapters/<env>/models.yaml with the same
# canonical ids on the left and its own host model strings on the right.
#
# `canonical id` MUST match an `id` entry in ../../../conf/model-profiles.conf.yaml.
# `host_model_id` MUST be the exact string to pass as the `model` argument to `runSubagent`
# ("Model Name (Vendor)", vendor is always "copilot" for this host).
#
# Scope: every `model_picker_enabled: true` chat model from this host's models.json catalog as of
# 2026-07-04 (20 models). Disabled/legacy/embedding catalog entries are intentionally excluded —
# they are not selectable dispatch targets.
model_bindings:
  gpt-5.5:
    host_model_id: "GPT-5.5 (copilot)"
  gpt-5.4:
    host_model_id: "GPT-5.4 (copilot)"
  gpt-5.4-mini:
    host_model_id: "GPT-5.4 mini (copilot)"
  gpt-5.3-codex:
